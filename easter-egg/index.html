<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Reality Portal</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      background: #040813;
      color: #cddaff;
      font-family: 'Doto', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button {
      font-size: 18px;
      padding: 10px 18px;
    }
    #portalStatus {
      max-width: 560px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js" defer></script>
</head>
<body>
  <canvas id="portalCanvas" width="420" height="680"></canvas>
  <div class="controls">
    <button id="startPortal">Start</button>
    <button id="stopPortal">Stop</button>
  </div>
  <p id="portalStatus">Tap start to enter the pocket reality.</p>

  <script type="module">
    import PocketRealityPortal from './app.js';

    const canvas = document.getElementById('portalCanvas');
    const statusEl = document.getElementById('portalStatus');
    const portal = new PocketRealityPortal(canvas, statusEl);

    document.getElementById('startPortal').addEventListener('click', () => portal.start());
    document.getElementById('stopPortal').addEventListener('click', () => portal.stop());
  </script>
</body>
</html>
